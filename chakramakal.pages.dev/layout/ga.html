<!DOCTYPE html>
<html lang="ga">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Chakramakal" />
	<title>Chakramakal</title>
	<link rel="icon" type="image/svg+xml" href="/assets/profile.svg" />
	<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
	<header>
		<a href="/ga/" aria-label="Baile" title="Baile">
			<img
				class="logo"
				src="/assets/profile.svg"
				alt=""
				width="48"
				height="48"
			/>
			<img
				class="banner"
				src="/assets/banner.svg"
				alt=""
				width="350"
				height="40"
			/>
		</a>
		<details class="lang">
			<summary title="Teanga" lang="ga">
				<span aria-hidden="true">🇮🇪</span> Gaeilge
			</summary>
			<ul>
				<li>
					<a
						href="/en/%%PATH%%"
						lang="en"
						hreflang="en"
					><span aria-hidden="true">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span> English</a>
				</li>
				<li>
					<a
						href="/ga/%%PATH%%"
						lang="ga"
						hreflang="ga"
						aria-current="page"
					><span aria-hidden="true">🇮🇪</span> Gaeilge</a>
				</li>
				<li>
					<a
						href="/ml/%%PATH%%"
						lang="ml"
						hreflang="ml"
					><span aria-hidden="true">🇮🇳</span> മലയാളം</a>
				</li>
			</ul>
		</details>
	</header>
	<main>
%%CONTENT%%
	</main>
	<footer>
		<p>
			Tá an t-ábhar ar an suíomh gréasáin seo ceadúnaithe faoi
			CC0 1.0 Universal
		</p>
		<img
			src="/assets/ie.svg"
			alt="Éire"
			title="Éire"
			width="24"
			height="24"
		/>
		<img
			src="/assets/eu.svg"
			alt="An tAontas Eorpach"
			title="An tAontas Eorpach"
			width="24"
			height="24"
		/>
	</footer>
</body>
</html>
